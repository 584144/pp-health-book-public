<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PP's健康簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* 布局：顶栏（成员切换 + 快捷入口）/ 桌面左侧导航、手机底部标签栏 / 白卡片内容区。浅底、白卡、一个竹青强调色。 */
:root {
  --bg: #f3f6f4;
  --card: #ffffff;
  --fg: #19231f;
  --muted: #64716b;
  --faint: #9aa59f;
  --line: #e2e8e4;
  --accent: #2e7558;
  --accent-soft: #e4f0ea;
  --accent-fg: #ffffff;
  --good: #2f7d4f;
  --warn: #a8701a;
  --warn-soft: #fbf1df;
  --bad: #bd4339;
  --bad-soft: #fbe8e6;
  --shadow: 0 1px 2px rgba(25, 35, 31, .05), 0 4px 16px rgba(25, 35, 31, .04);
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412; --card: #182019; --fg: #e5ebe7; --muted: #9aa8a1; --faint: #6c7a73; --line: #28322d;
    --accent: #5fbb92; --accent-soft: #1c2e25; --accent-fg: #0f1412;
    --good: #6cc48f; --warn: #e2ab52; --warn-soft: #2e2617; --bad: #ec7a6f; --bad-soft: #321c1a;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412; --card: #182019; --fg: #e5ebe7; --muted: #9aa8a1; --faint: #6c7a73; --line: #28322d;
  --accent: #5fbb92; --accent-soft: #1c2e25; --accent-fg: #0f1412;
  --good: #6cc48f; --warn: #e2ab52; --warn-soft: #2e2617; --bad: #ec7a6f; --bad-soft: #321c1a;
  --shadow: none; color-scheme: dark;
}
/* ===== 风格预览：?theme=cream / noir / clinic / editorial，选定前不改默认 ===== */
/* 奶油极简：暖白底、焦糖色强调、大圆角和柔和阴影 */
:root[data-style="cream"] {
  --bg: #f6f1e9; --card: #fffdf9; --fg: #2b2520; --muted: #7c7066; --faint: #aa9f94; --line: #ece4d8;
  --accent: #a8673f; --accent-soft: #f4e7dc; --accent-fg: #fffaf4; --good: #5f8a5b; --warn: #b07a2a; --warn-soft: #f8eedd; --bad: #b5503f; --bad-soft: #f8e5df;
  --shadow: 0 1px 2px rgba(80, 55, 30, .04), 0 10px 30px rgba(80, 55, 30, .07); --r: 22px; color-scheme: light;
}
:root[data-style="cream"] .card { border-color: transparent; padding: 22px 24px; }
:root[data-style="cream"] .top { background: rgba(255, 253, 249, .86); backdrop-filter: blur(14px); border-bottom-color: transparent; box-shadow: 0 1px 0 var(--line); }
:root[data-style="cream"] nav.side a[aria-current="page"] { background: var(--card); box-shadow: var(--shadow); color: var(--accent); }
:root[data-style="cream"] .btn { border-radius: 999px; }
:root[data-style="cream"] .page-head h1, :root[data-style="cream"] .hero .hello { font-weight: 600; letter-spacing: .02em; }
:root[data-style="cream"] .tile .v, :root[data-style="cream"] .mcard .v { font-family: var(--f-display); font-weight: 600; }
/* 深色高级：石墨黑底、香槟金强调、细边框，不跟随系统浅色 */
:root[data-style="noir"] {
  --bg: #0d0e10; --card: #16171a; --fg: #eeece6; --muted: #9b978d; --faint: #6f6c65; --line: #26272b;
  --accent: #cfae72; --accent-soft: #2a2419; --accent-fg: #15130e; --good: #8fc0a0; --warn: #e0b260; --warn-soft: #2c2416; --bad: #e98272; --bad-soft: #321d19;
  --shadow: 0 0 0 1px rgba(255, 255, 255, .02), 0 12px 32px rgba(0, 0, 0, .35); --r: 16px; color-scheme: dark;
}
:root[data-style="noir"] .top { background: rgba(13, 14, 16, .88); backdrop-filter: blur(14px); }
:root[data-style="noir"] body::before { background: #0d0e10; }
:root[data-style="noir"] .card { background: linear-gradient(180deg, #18191c, #141518); }
:root[data-style="noir"] .page-head h1, :root[data-style="noir"] .brand, :root[data-style="noir"] .hero .hello { color: #f3e7cf; font-weight: 600; letter-spacing: .04em; }
:root[data-style="noir"] .tile .v, :root[data-style="noir"] .mcard .v { font-family: var(--f-display); font-weight: 600; color: #f3e7cf; }
:root[data-style="noir"] nav.side a[aria-current="page"] { background: transparent; box-shadow: inset 2px 0 0 var(--accent); border-radius: 0 10px 10px 0; }
:root[data-style="noir"] .btn.primary { background: linear-gradient(180deg, #d9bb83, #bf9c5e); border-color: #bf9c5e; }
/* 柔和医疗清新：浅蓝灰底、沉静蓝强调、无衬线大数字，信息清楚 */
:root[data-style="clinic"] {
  --bg: #f2f5fa; --card: #ffffff; --fg: #142033; --muted: #5d6b80; --faint: #98a3b4; --line: #e3e8f0;
  --accent: #3466d6; --accent-soft: #e6eefd; --accent-fg: #ffffff; --good: #1f9a7a; --warn: #c27d18; --warn-soft: #fcf1de; --bad: #d14b45; --bad-soft: #fde8e7;
  --shadow: 0 1px 2px rgba(20, 32, 51, .04), 0 6px 20px rgba(20, 32, 51, .06); --r: 18px; --f-display: "Noto Sans SC", "PingFang SC", system-ui, sans-serif; color-scheme: light;
}
:root[data-style="clinic"] .card { border-color: transparent; }
:root[data-style="clinic"] .page-head h1, :root[data-style="clinic"] .hero .hello { font-weight: 700; letter-spacing: -.01em; }
:root[data-style="clinic"] .tile .v, :root[data-style="clinic"] .mcard .v { font-weight: 700; letter-spacing: -.02em; color: #0f2a5c; }
:root[data-style="clinic"] nav.side a[aria-current="page"] { background: var(--accent); color: #fff; }
:root[data-style="clinic"] .stripe { width: 3px; }
/* 杂志编排：纸张底、墨黑细线、朱红点缀、大号宋体标题，几乎不用阴影 */
:root[data-style="editorial"] {
  --bg: #f4f1e8; --card: #fbf9f3; --fg: #141311; --muted: #6b665c; --faint: #a19b8f; --line: #d9d3c4;
  --accent: #c8432a; --accent-soft: #f6e3dc; --accent-fg: #fffaf2; --good: #3e6e4f; --warn: #a8701a; --warn-soft: #f3e9d4; --bad: #b8382a; --bad-soft: #f5e1dc;
  --shadow: none; --r: 4px; color-scheme: light;
}
:root[data-style="editorial"] .card { border: 0; border-top: 2px solid var(--fg); border-radius: 0; background: transparent; padding: 14px 2px 18px; }
:root[data-style="editorial"] .card h2 { font-family: var(--f-display); font-size: 19px; }
:root[data-style="editorial"] .page-head h1 { font-size: 34px; letter-spacing: .02em; }
:root[data-style="editorial"] .top { background: var(--bg); border-bottom: 1px solid var(--fg); }
:root[data-style="editorial"] .tile .v, :root[data-style="editorial"] .mcard .v { font-family: var(--f-display); font-weight: 700; }
:root[data-style="editorial"] nav.side a[aria-current="page"] { background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: 6px; }
:root[data-style="editorial"] .btn, :root[data-style="editorial"] .pill, :root[data-style="editorial"] .seg { border-radius: 2px; }
:root[data-style="editorial"] .btn.primary { background: var(--fg); border-color: var(--fg); color: var(--bg); }
:root[data-style="editorial"] .hero .hello { font-size: 30px; }
/* 今日顶部的问候（所有风格通用） */
.hero { margin: 4px 0 14px; }
.hero .hello { font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.hero .sub { color: var(--muted); font-size: 13px; margin-top: 2px; display: flex; flex-wrap: wrap; gap: 6px 10px; }
.style-pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.style-pick button { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; }
.style-pick button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.style-pick .sw { display: flex; gap: 4px; margin-bottom: 6px; } .style-pick .sw i { width: 16px; height: 16px; border-radius: 50%; display: block; border: 1px solid rgba(0,0,0,.08); }
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.6; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--card); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* 顶栏 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--card); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; }
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-size: 21px; font-weight: 700; letter-spacing: .02em; white-space: nowrap; }
.brand small { font-family: var(--f-body); font-size: 11px; font-weight: 500; color: var(--muted); margin-left: 8px; letter-spacing: .04em; }
.members { position: relative; display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 3px; }
.members .m-ava { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg, #fff); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.members select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: var(--fg); padding: 2px 16px 2px 0; cursor: pointer; }
.members::after { content: ''; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.sync { font-size: 12px; color: var(--muted); }
.top .spacer { flex: 1; }
.quick { display: flex; gap: 8px; align-items: center; }
.me-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--accent-soft); color: var(--accent); font-weight: 700; cursor: pointer; font: inherit; font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--card); padding: 7px 14px; border-radius: 10px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--accent); padding-inline: 6px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* 框架 */
.shell { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 48px; }
nav.side { position: sticky; top: 88px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
nav.side a, nav.tabs a { text-decoration: none; color: var(--muted); }
nav.side a { padding: 9px 12px; border-radius: 10px; font-size: 15px; }
nav.side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
nav.side a:hover { color: var(--fg); }
nav.tabs { display: none; }
main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.demo-note { font-size: 12px; color: var(--warn); background: var(--warn-soft); padding: 6px 12px; border-radius: 8px; }

.page-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.page-head h1 { font-family: var(--f-display); font-size: 26px; font-weight: 700; }
.page-head p { margin: 0; color: var(--muted); font-size: 14px; }
.page-head .spacer { flex: 1; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { font-weight: 400; color: var(--muted); font-size: 13px; }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-head .spacer { flex: 1; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

.label { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.empty { color: var(--faint); }
.nodata { color: var(--faint); font-size: 15px; font-weight: 500; }

/* 今日健康 */
.today { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0; }
.tile { padding: 4px 16px; border-left: 1px solid var(--line); min-width: 0; }
.tile:first-child { border-left: 0; padding-left: 0; }
.tile .v { font-size: 26px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
.tile .v .u { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.tile .meta { font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 分段控件 */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
.seg button { border: 0; background: transparent; padding: 4px 11px; white-space: nowrap; flex: none; font-size: 13px; color: var(--muted); border-left: 1px solid var(--line); }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 3px 12px; font-size: 13px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 500; }

.trend-sum { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 6px; }
.trend-sum .big { font-size: 28px; font-weight: 700; }
.trend-sum .delta { font-size: 14px; font-weight: 500; }
.chart { width: 100%; min-height: 200px; position: relative; }
/* 悬停读数 */
.tip { position: fixed; z-index: 70; pointer-events: none; background: var(--fg); color: var(--card); font-size: 12px; line-height: 1.55; padding: 6px 10px; border-radius: 8px; white-space: nowrap; box-shadow: 0 4px 16px rgba(0, 0, 0, .18); }
.tip b { font-size: 14px; }
.tip .tl { opacity: .75; }
svg[data-hover] { cursor: crosshair; touch-action: pan-y; }
.mini { display: inline-block; width: 150px; flex: none; }
.mini svg { width: 150px; height: 30px; display: block; }
.who { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.who:hover .who-go { color: var(--accent); }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-family: var(--f-display); font-size: 22px; font-weight: 700; flex: none; }
.who .nm { font-family: var(--f-display); font-size: 22px; font-weight: 700; line-height: 1.3; }
.who .facts { font-size: 13px; color: var(--muted); }
.who-go { margin-left: auto; font-size: 14px; color: var(--muted); white-space: nowrap; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; margin-bottom: 8px; }
.thumbs a { display: block; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); }
.thumbs img { display: block; width: 100%; height: 120px; object-fit: cover; }
.qr { width: 220px; margin: 0 auto; background: #fff; padding: 8px; border-radius: 10px; }
.qr svg { display: block; width: 100%; height: auto; }
.trendline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-left: 12px; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.cmp > div { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.cmp .v { font-size: 18px; font-weight: 700; }
.up { color: var(--warn); } .down { color: var(--accent); }
.chart svg { display: block; width: 100%; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }

/* 列表 */
.list { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); min-width: 0; }
.row:first-child { border-top: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 500; }
.row .s { font-size: 13px; color: var(--muted); }
.row.click { cursor: pointer; }
.row.click:hover .t { color: var(--accent); }
.pill { display: inline-block; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--bg); color: var(--muted); white-space: nowrap; font-weight: 500; }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.good { background: var(--accent-soft); color: var(--good); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.stripe { width: 4px; align-self: stretch; border-radius: 4px; background: var(--line); flex: none; }
.stripe.good { background: var(--good); } .stripe.bad { background: var(--bad); } .stripe.warn { background: var(--warn); } .stripe.acc { background: var(--accent); }
.date-col { width: 64px; flex: none; font-size: 13px; color: var(--muted); }

.brief { font-size: 15px; line-height: 1.8; }
.brief p { margin: 0 0 6px; }

/* 健康数据 */
.metric-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.mcard { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mcard:hover { border-color: var(--accent); }
.mcard[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.mcard .v { font-size: 21px; font-weight: 700; }
.mcard .v .u { font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 2px; }
.mcard svg { width: 100%; height: 30px; display: block; margin-top: 4px; }
.mcard .meta { font-size: 12px; color: var(--faint); }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--bg); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }

/* 表单 */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .field > .label-t { font-size: 13px; color: var(--muted); font-weight: 500; }
.field .req { color: var(--bad); margin-left: 2px; }
input[type="text"], input[type="number"], input[type="date"], input[type="datetime-local"], input[type="month"], select, textarea {
  border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 12px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea { resize: vertical; min-height: 70px; }
.f-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.sev { display: flex; gap: 4px; flex-wrap: wrap; }
.sev button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); font-weight: 500; }
.sev button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
details.adv summary { cursor: pointer; color: var(--accent); font-size: 14px; font-weight: 500; }
details.adv[open] summary { margin-bottom: 12px; }

function lineChart(el, pts, o) {
  o = o || {};

  const L = 44, R = 16, T = 14, B = 26;
  const vals = pts.map(p => p.v).filter(isNum);
  if (!vals.length) { el.innerHTML = '<div style="height:' + H + 'px;display:grid;place-items:center">' + NO_DATA + '</div>'; return; }
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (isNum(o.refLow)) lo = Math.min(lo, o.refLow); if (isNum(o.refHigh)) hi = Math.max(hi, o.refHigh);
  if (hi === lo) { hi += 1; lo -= 1; }
  const span = hi - lo; lo -= span * 0.12; hi += span * 0.12;
  const t0 = pts[0].d.getTime(), t1 = pts[pts.length - 1].d.getTime() || t0 + 1;
  const x = d => L + (W - L - R) * ((d.getTime() - t0) / Math.max(1, t1 - t0));
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  const baseDec = o.dec == null ? 1 : o.dec, yDec = (hi - lo) < 4 * Math.pow(10, -baseDec) ? baseDec + 1 : baseDec;
  const fmt = o.fmt || (v => v.toFixed(yDec));

  // 参考范围
  if (isNum(o.refLow) || isNum(o.refHigh)) {
    const a = y(isNum(o.refHigh) ? o.refHigh : hi), b = y(isNum(o.refLow) ? o.refLow : lo);
    s += '<rect x="' + L + '" y="' + a + '" width="' + (W - L - R) + '" height="' + Math.max(0, b - a) + '" fill="var(--accent-soft)"/>';
  }
  // 网格
  for (let i = 0; i <= 3; i++) {
    const v = lo + (hi - lo) * (0.1 + 0.8 * i / 3), yy = y(v);
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>';
    s += '<text x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(fmt(v)) + '</text>';
  }
  // X 轴标签
  const idx = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  idx.forEach((i, k) => {
    const d = pts[i].d, lab = o.yearFmt ? d.getFullYear() + '/' + (d.getMonth() + 1) : (d.getMonth() + 1) + '/' + d.getDate();
    s += '<text x="' + x(d) + '" y="' + (H - 6) + '" text-anchor="' + (k === 0 ? 'start' : k === idx.length - 1 ? 'end' : 'middle') + '">' + lab + '</text>';
  });
  // 原始点（淡）
  const raw = pts.filter(p => isNum(p.v));
  if (o.connect || !o.smooth) {
    let path = '', open = false;
    pts.forEach(p => { if (isNum(p.v)) { path += (open ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p.v).toFixed(1); open = true; } else if (!o.connect) open = false; });
    s += '<path d="' + path + '" fill="none" stroke="' + (o.smooth ? 'var(--faint)' : 'var(--accent)') + '" stroke-width="' + (o.smooth ? 1 : 2) + '" stroke-linejoin="round" opacity="' + (o.smooth ? .5 : 1) + '"/>';
  }
  if (o.dots !== false) raw.forEach(p => { s += '<circle cx="' + x(p.d).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (o.smooth ? 1.6 : 3.2) + '" fill="' + (o.smooth ? 'var(--faint)' : 'var(--accent)') + '" opacity="' + (o.smooth ? .55 : 1) + '"/>'; });
  // 滚动平均（趋势优先）
  const sm = [];
  if (o.smooth) {
    const w = o.smooth;
    pts.forEach((p, i) => { const win = pts.slice(Math.max(0, i - w + 1), i + 1).map(q => q.v).filter(isNum); if (win.length >= 2 && isNum(p.v) || win.length >= Math.ceil(w / 2)) sm.push({ d: p.d, v: avg(win) }); });

      const line = sm.map((p, i) => (i && p.d - sm[i - 1].d < 1.5 * 864e5 ? 'L' : 'M') + x(p.d).toFixed(1) + ' ' + y(p.v).toFixed(1)).join('');

    }

  s += '<rect x="' + L + '" y="0" width="' + (W - L - R) + '" height="' + H + '" fill="transparent"/>';

/* ---- 月经周期：Apple 健康的经期记录 + 手动记录，算周期长度、经期天数和下次估算 ---- */
function periodsOf(mid) {
  const days = ((S.menstrual || {})[mid] || []).map(d => d.date).sort();
  const ps = [];
  days.forEach(d => { const last = ps[ps.length - 1]; if (last && (parse(d) - parse(last.end)) / 864e5 <= 2) last.end = d; else ps.push({ start: d, end: d, src: 'Apple 健康' }); });
  ps.forEach(p0 => { const fl = ((S.menstrual || {})[mid] || []).filter(d => d.date >= p0.start && d.date <= p0.end).map(d => d.flow); p0.flow = ['多', '中', '少', '有'].find(f => fl.includes(f)) || ''; });
  (S.cycles || []).filter(c => c.member_id === mid).forEach(c => {
    const near = ps.find(p0 => Math.abs((parse(p0.start) - parse(c.start)) / 864e5) <= 3);
    const v = { start: c.start, end: c.end || c.start, src: '手动记录', flow: c.flow || '', pain: c.pain, note: c.note, id: c.id };
    if (near) Object.assign(near, v); else ps.push(v);
  });
  ps.sort((a, b) => a.start < b.start ? -1 : 1);
  ps.forEach((p0, i) => { p0.days = Math.round((parse(p0.end) - parse(p0.start)) / 864e5) + 1; p0.cycle = ps[i + 1] ? Math.round((parse(ps[i + 1].start) - parse(p0.start)) / 864e5) : null; });

}
/* 手腕温度（Apple Watch 睡眠时测，相对个人基线）：连续 3 晚都高于前 6 晚的最高值，说明排卵后体温上升（「3 高于 6」规则） */
function tempShift(mid, from, to) {
  const xs = S.daily.filter(x => x.member_id === mid && isNum(x.wrist_temp) && x.date >= from && x.date < to).sort((a, b) => a.date < b.date ? -1 : 1);
  for (let i = 6; i + 2 < xs.length; i++) {
    const top = Math.max(...xs.slice(i - 6, i).map(x => x.wrist_temp));
    if ([0, 1, 2].every(j => xs[i + j].wrist_temp > top + 0.05)) return { date: xs[i].date, day: Math.round((parse(xs[i].date) - parse(from)) / 864e5) + 1, rise: avg(xs.slice(i, i + 3).map(x => x.wrist_temp)) - avg(xs.slice(i - 6, i).map(x => x.wrist_temp)) };
  }

}

  const avgLen = lens.length ? Math.round(avg(lens)) : null, avgDays = Math.round(avg(ps.slice(-6).map(p0 => p0.days)) * 10) / 10;
  const day = Math.round((TODAY - parse(last.start)) / 864e5) + 1;

  // 乳腺 B 超：月经干净后 7–10 天；这次的窗口已过就按下次预计的经期往后推
  const ext = isNum(avgDays) ? Math.round(avgDays) : 5;
  const lastEnd = last.end && last.end !== last.start ? last.end : iso(addDays(parse(last.start), ext - 1));

  if (breast.to < iso(TODAY) && next) { const ne = iso(addDays(parse(next), ext - 1)); breast = { from: iso(addDays(parse(ne), 7)), to: iso(addDays(parse(ne), 10)), basis: '按下次预计 ' + next + ' 来、经期 ' + ext + ' 天估算' }; }
  if (breast.to < iso(TODAY)) breast = null;
  // 过去几个周期里，体温上升前一天当作排卵日，算出自己的黄体期长度（正常大约 10–16 天），代替默认的 14 天

}

/* PDF 报告自动读取：有文字层的 PDF 在浏览器里直接提取；照片和扫描件留给服务器版的 AI 识别 */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const loaded = {};
function loadScript(src) {
  return loaded[src] || (loaded[src] = new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => { delete loaded[src]; no(new Error('load ' + src)); }; document.head.appendChild(s); }));
}
async function pdfLines(file) {
  await loadScript(PDFJS + 'pdf.min.js');
  await loadScript(PDFJS + 'pdf.worker.min.js');
  const lib = window.pdfjsLib;
  lib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  const lines = [];
  for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    const rows = [];
    tc.items.forEach(it => {
      if (!it.str || !it.str.trim()) return;
      const x = it.transform[4], y = it.transform[5];
      let r = rows.find(r => Math.abs(r.y - y) < 3);
      if (!r) { r = { y, items: [] }; rows.push(r); }
      r.items.push({ x, s: it.str, w: it.width || 0 });
    });
    rows.sort((a, b) => b.y - a.y).forEach(r => {
      r.items.sort((a, b) => a.x - b.x);
      let line = '', end = null;
      r.items.forEach(i => { line += (end != null && i.x - end > 2 ? '  ' : '') + i.s; end = i.x + i.w; });
      lines.push(line.trim());
    });
  }
  return lines;
}
const RANGE = /(\d+(?:\.\d+)?)\s*[-–~～—]{1,2}\s*(\d+(?:\.\d+)?)|([<≤＜])\s*=?\s*(\d+(?:\.\d+)?)|([>≥＞])\s*=?\s*(\d+(?:\.\d+)?)/;
const UNIT = /^(?:[×x]?10\^?\d+\/[A-Za-zμµ]+|[A-Za-zμµ%‰][A-Za-z0-9μµ%‰\/\^\*\.·²³]*)$/;
const SKIP = /日期|时间|电话|年龄|性别|编号|姓名|科室|床号|页|地址|身份证|样本|标本|条码/;
function parseLab(line) {
  const norm = line.replace(/[（]/g, '(').replace(/[）]/g, ')').replace(/：/g, ':');
  if (SKIP.test(norm)) return null;
  const toks = norm.split(/\s+/).filter(Boolean);
  const vi = toks.findIndex((t, i) => i > 0 && /^[<>≤≥]?\d+(?:\.\d+)?(?:↑|↓|H|L)?$/.test(t));
  if (vi < 1) return null;
  let nameToks = toks.slice(0, vi);
  if (/^\d{1,3}$/.test(nameToks[0])) nameToks = nameToks.slice(1);
  const name = nameToks.join(' ').trim();
  if (!name || name.length > 30 || !/[A-Za-z一-龥]/.test(name) || /^[\d.]+$/.test(name)) return null;
  const value = parseFloat(toks[vi].replace(/[<>≤≥↑↓HL]/g, ''));
  const rest = toks.slice(vi + 1).filter(t => !/^(↑|↓|H|L|高|低|偏高|偏低)$/.test(t));
  const restStr = rest.join(' ');
  const m = restStr.match(RANGE);
  const unit = rest.find(t => UNIT.test(t) && !RANGE.test(t)) || '';
  if (!m && !unit) return null;
  let low = null, high = null;
  if (m) { if (m[1] != null) { low = +m[1]; high = +m[2]; } else if (m[3]) high = +m[4]; else if (m[5]) low = +m[6]; }
  return { kind: 'lab', name, value, unit, ref_low: low, ref_high: high, region: classify(name), finding: '' };
}
async function extractReport(file) {
  const lines = await pdfLines(file);
  const text = lines.join('\n');
  const out = { lines: lines.length, metrics: [] };
  const dm = text.match(/(?:报告|检查|采样|送检|体检|审核|签发)(?:日期|时间)\s*[:：]?\s*(\d{4})[-/年.](\d{1,2})[-/月.](\d{1,2})/) || text.match(/(20\d{2})[-/年.](\d{1,2})[-/月.](\d{1,2})/);
  if (dm) out.date = dm[1] + '-' + pad(dm[2]) + '-' + pad(dm[3]);
  const om = text.match(/([一-龥A-Za-z()（）]{2,30}?(?:医院|体检中心|健康管理中心|诊所|卫生院|检验所|门诊部))/);
  if (om) out.org = om[1];
  lines.forEach(l => { const r = parseLab(l); if (r) out.metrics.push(r); });
  const nm = text.match(/检查(?:项目|部位|名称)\s*[:：]\s*([^\n]{2,40})/);
  const cm = text.match(/(?:诊断意见|检查结论|影像诊断|超声提示|印象|结论)\s*[:：]?\s*\n?([\s\S]{2,300}?)(?:\n\s*(?:报告医生|审核医生|诊断医生|医师|签名|报告日期|检查日期)|$)/);
  if (nm && cm) {
    const name = nm[1].split(/\s{2,}/)[0].trim();
    out.metrics.unshift({ kind: 'imaging', name, value: null, unit: '', ref_low: null, ref_high: null, region: classify(name + ' ' + cm[1]), finding: cm[1].replace(/\s*\n\s*/g, ' ').trim(),
      method: /MRI|磁共振/i.test(name) ? 'MRI' : /CT/i.test(name) ? 'CT' : /超声|B超|彩超/.test(name) ? '超声' : /X线|DR|X光/.test(name) ? 'X 线' : '' });
    out.title = name;
  }
  out.type = /体检/.test(text) ? '体检' : nm ? '检查' : out.metrics.length ? '化验单' : null;
  return out;
}

      });
    }

    const bad = cs.filter(isAbn).sort((a, b) => a.date < b.date ? 1 : -1);
    if (bad.length) { out.push('', '### 超出参考范围的化验', ''); bad.forEach(c => out.push('- ' + c.date + ' ' + c.name + '：' + c.value + ' ' + c.unit + '（参考 ' + refText(c) + '，' + flagWord(flag(c), c) + '）· ' + c.source)); }
    const recs = S.records.filter(r => r.member_id === mid).sort((a, b) => a.date < b.date ? -1 : 1);
    if (recs.length) {
      out.push('', '### 就诊与检查（按时间）', '');
      recs.forEach(r => {
        out.push('- **' + r.date + ' ' + r.org + '：' + r.title + '**' + (r.note ? ' — ' + r.note : ''));

        const n = cs.filter(c => c.record_id === r.id && isNum(c.value)).length; if (n) out.push('  - 化验 ' + n + ' 项，其中超出范围 ' + cs.filter(c => c.record_id === r.id && isAbn(c)).length + ' 项（明细见 表格/化验与检查结果.csv）');

      if (p.repeat_months) S.plans.push(Object.assign({}, p, { id: uid('pl'), status: 'future', date: iso(new Date(TODAY.getFullYear(), TODAY.getMonth() + p.repeat_months, TODAY.getDate())) }));
      save(); toast('已完成：' + p.title); render(); } return; }
  if (t.closest('[data-gomeds]')) { ui.medTab = 'meds'; go('medical'); return; }
  if ((b = t.closest('[data-medtab]'))) { ui.medTab = b.dataset.medtab; render(); return; }
  if ((b = t.closest('[data-repcat]'))) { ui.repCat = b.dataset.repcat; render(); return; }
  if (t.closest('#qMe')) { openMeMenu(); return; }
  if ((b = t.closest('[data-suppstop]'))) { const x = (S.meds || []).find(y => y.id === b.dataset.suppstop); if (x) stopMed(x); return; }
  if ((b = t.closest('[data-supp]'))) { openSuppForm(b.dataset.supp); return; }
  if ((b = t.closest('[data-lifetab]'))) { ui.lifeTab = b.dataset.lifetab; render(); return; }
  if ((b = t.closest('[data-ckok]'))) { const c = S.checkins.find(x => x.id === b.dataset.ckok); if (c) { c.status = 'confirmed'; touch(c); save(); toast('已确认'); render(); } return; }
  if ((b = t.closest('[data-ckundo]'))) { const c = S.checkins.find(x => x.id === b.dataset.ckundo); if (c && confirm('撤销 ' + c.date + ' 的这条记录？手表等自动同步的数据不受影响。')) { c.status = 'undone'; touch(c); save(); toast('已撤销'); render(); } return; }
  if ((b = t.closest('[data-ckedit]'))) { openCheckin(b.dataset.ckedit); return; }
  if ((b = t.closest('[data-rtdone]'))) { const r = S.routines.find(x => x.id === b.dataset.rtdone); if (r) { r.last = iso(TODAY); touch(r); save(); toast('已记录：' + r.name); render(); } return; }
  if ((b = t.closest('[data-rtedit]'))) { openRoutine(b.dataset.rtedit); return; }
  if ((b = t.closest('[data-prod]'))) { openProduct(b.dataset.prod); return; }
  if ((b = t.closest('[data-goal]'))) { openGoal(b.dataset.goal); return; }
  if (t.closest('[data-addaes]')) { openAesthetic(); return; }
  if ((b = t.closest('[data-sltab]'))) { ui.slTab = b.dataset.sltab; render(); return; }
  if ((b = t.closest('[data-slrange]'))) { ui.slRange = +b.dataset.slrange; render(); return; }
  if ((b = t.closest('[data-slhabit]'))) { openSleepHabit(b.dataset.slhabit); return; }
  if ((b = t.closest('[data-tplan]'))) { openTrainPlan(b.dataset.tplan); return; }
  if ((b = t.closest('[data-food]'))) { openFood(b.dataset.food); return; }
  if ((b = t.closest('[data-ltab]'))) { ui.logTab = b.dataset.ltab; render(); return; }
  if ((b = t.closest('[data-addmed]'))) { openMedForm(null, b.dataset.addmed === 'once' ? { kind: 'once' } : b.dataset.addmed === 'rec' ? { kind: 'long', source: 'doctor', record_id: b.dataset.rec2, start: (S.records.find(r => r.id === b.dataset.rec2) || {}).date } : { kind: 'long' }); return; }
  if ((b = t.closest('[data-medstop]'))) { const x = (S.meds || []).find(y => y.id === b.dataset.medstop); if (x) stopMed(x); return; }
  if ((b = t.closest('[data-med]'))) { const x = (S.meds || []).find(y => y.id === b.dataset.med); if (x) openMedForm(x); return; }
  if (t.closest('#addCycle')) { openCycleForm(); return; }
  if ((b = t.closest('[data-cyc]'))) { const c = (S.cycles || []).find(y => y.id === b.dataset.cyc); if (c) openCycleForm(c); return; }
  if ((b = t.closest('[data-symend]'))) { const x = S.symptoms.find(y => y.id === b.dataset.symend); if (x) { const n = new Date(); x.ongoing = false; x.end = iso(n) + 'T' + pad(n.getHours()) + ':' + pad(n.getMinutes()); x.user = true; save(); toast('已记录结束时间'); render(); } return; }
  if ((b = t.closest('[data-share]'))) { openShare(b.dataset.share); return; }
  if ((b = t.closest('[data-revoke]'))) { revokeShare(b.dataset.revoke, b.dataset.rec2); return; }
  if (t.closest('#editProfile')) { openProfileForm(); return; }
  if ((b = t.closest('[data-addfu]'))) { const f = fuCache && fuCache.list[+b.dataset.addfu], rec = fuCache && S.records.find(r => r.id === fuCache.rec);
    if (f && rec) { S.plans.push(planFrom(f, rec, true)); save(); toast('已加入计划：' + f.title); openRecord(rec.id); } return; }
  if ((b = t.closest('[data-planfor]'))) { openPlanForm(null, b.dataset.planfor); return; }
  if ((b = t.closest('[data-plan]'))) { const p = S.plans.find(x => x.id === b.dataset.plan); if (p) openPlanForm(p); return; }
  if (t.closest('#copyCheckup')) { const txt = checkupText(); navigator.clipboard.writeText(txt).then(() => toast('清单已复制，可以发给体检中心或医生'), () => { modal('<div class="modal-head"><h2>下次体检清单</h2><button class="x" data-close type="button" aria-label="关闭">×</button></div><pre class="code" style="white-space:pre-wrap">' + esc(txt) + '</pre>'); }); return; }
  if (t.closest('#addPlan')) { openPlanForm(); return; }
  if (t.closest('#appleSetup')) { openAppleSetup(); return; }
  if ((b = t.closest('[data-export]'))) { openExport(b.dataset.export); return; }
  if (t.closest('#resetDemo')) {
    modal('<div class="modal-head"><h2>重置示例数据？</h2><button class="x" data-close type="button" aria-label="关闭">×</button></div><p style="margin:0">你在模板里新增的症状、档案和计划都会被清除，恢复成初始示例。</p><div class="modal-foot"><button class="btn" type="button" data-close>取消</button><button class="btn primary" type="button" id="resetYes">重置</button></div>');
    return;
  }
  if (t.closest('#resetYes')) { S = seed(); save(); closeModal(); toast('已重置'); render(); return; }
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('who') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); go('profile'); return; }
  const b = e.target.closest && e.target.closest('svg [data-region]');
  if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ui.region = b.dataset.region; ui.q = ''; render(); const n = document.querySelector('svg [data-region="' + ui.region + '"]'); if (n) n.focus(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'atlasQ') return;
  ui.q = e.target.value; render();
  const q = $('#atlasQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.origfor) { const id = t.dataset.origfor; uploadOriginals(id, [...t.files]).then(() => openRecord(id)); return; }
  if (t.dataset.rem) { S.reminders[t.dataset.rem] = t.checked; save(); toast((t.checked ? '已开启' : '已关闭') + '提醒'); }
  if (t.id === 'loginAs') { S.loginAs = t.value; S.current = t.value; save(); render(); toast('现在以 ' + login().name + ' 的账号查看'); }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'addMember') return;
  e.preventDefault();
  const n = $('#newMember').value.trim(); if (!n) return;
  const id = uid('m');
  S.members.push({ id, name: n, account: 'sub', status: 'active', user: true });
  S.sources[id] = { apple: false, xiaomi: false, reports: false, manual: true };
  save(); toast('已添加成员：' + n); render();
});
let rz;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawTrend(); drawMetric(); }, 120); });

render();
if (/^https?:$/.test(location.protocol)) {
  fetch('api/state', { headers: { Accept: 'application/json' } })
    .then(r => r.ok && (r.headers.get('content-type') || '').includes('json') ? r.json() : null)
    .then(d => { if (!d || !Array.isArray(d.members)) return; LIVE = true; S = Object.assign({ loginAs: d.members[0] && d.members[0].id, current: null, reports: [], appleSync: {}, files: {}, shares: [], meds: [], cycles: [], menstrual: {}, checkins: [], goals: [], routines: [], products: [], foods: [] }, d); S.meds = S.meds.filter(x => !x.removed); cleanBodyFat(); render(); })
    .catch(() => {});
}
})();
</script>
