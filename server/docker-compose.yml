services:
  pp-health-book:
    build: .
    container_name: pp-health-book
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3100:3000"   # 网页和数据接口：只对本机开放，由 nginx 反向代理到域名；3100 避开服务器上已有服务
    volumes:
      - ./data:/app/data        # 健康数据保存在宿主机，重建容器不丢
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
